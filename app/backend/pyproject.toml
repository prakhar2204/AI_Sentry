[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ─────────────────────────────────────────────────────────────
#  Project metadata
# ─────────────────────────────────────────────────────────────

[project]
name            = "aisentry"
version         = "0.1.0-dev"
description     = "AI-SENTRY — LLM Security Orchestration Platform"
readme          = "README.md"
requires-python = ">=3.10"
license         = { text = "Apache-2.0" }
keywords        = ["llm", "security", "red-teaming", "ai-safety"]

# Core runtime dependencies — always installed.
dependencies = [
    "httpx>=0.27",   # HTTP client for endpoint validation and test requests
]

# ─────────────────────────────────────────────────────────────
#  Optional dependency groups
# ─────────────────────────────────────────────────────────────

[project.optional-dependencies]
engines = [
    # Scanning engines — pinned to tested versions.
    # DO NOT change these versions without running the full test suite.
    "garak==0.17.0",            # D-002: Garak pinned to 0.17.0 (verified in B1-B6)
    "pyrit==1.1.0",             # D-020, D-021: PyRIT real package name; pinned to 1.1.0
]

reports = [
    "weasyprint>=61.0,<62.0",   # D-019: PDF renderer (WeasyPrint)
]

aws = [
    "boto3>=1.34,<2.0",         # D-022: AWS deployment engine
]

dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",                # linter + formatter
    "mypy>=1.0",
    "respx>=0.20",              # httpx mock library for tests
]

# Install core + dev:
#   pip install -e ".[dev]"
#
# Install everything:
#   pip install -e ".[engines,reports,aws,dev]"

# ─────────────────────────────────────────────────────────────
#  CLI entry points
# ─────────────────────────────────────────────────────────────

[project.scripts]
ai-sentry = "cli.main:main"    # matches the command users type
aisentry  = "cli.main:main"    # alias — works without the hyphen too

# ─────────────────────────────────────────────────────────────
#  Package discovery
# ─────────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*"]

# ─────────────────────────────────────────────────────────────
#  Tool configuration
# ─────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = ["."]           # ensures `from core.x import ...` resolves
addopts      = "-v --tb=short"
markers      = [
    "integration: tests that require a live server (fake or real); skipped in pure-unit runs",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version    = "3.10"
strict            = false
ignore_missing_imports = true
